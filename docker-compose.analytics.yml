# Umami self-hosted (opcional).
# Mientras el DNS esté en pausa usamos Umami Cloud. Cuando exista
# analitica.solutiacorp.co, levanta este stack con:
#
#   UMAMI_DB_PASSWORD=... UMAMI_APP_SECRET=... docker compose -f docker-compose.analytics.yml up -d
#
# y cambia NEXT_PUBLIC_UMAMI_SRC a https://analitica.solutiacorp.co/analitica/script.js

services:
  umami-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      BASE_PATH: /analitica
      TRACKER_SCRIPT_NAME: script.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  umami-db:
